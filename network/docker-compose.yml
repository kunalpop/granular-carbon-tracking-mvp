# Carbon MVP private network: Hyperledger Besu, QBFT consensus.
# 4 validators (consortium members) + 1 regulator/observer node.
# Start:  docker compose up -d      Stop:  docker compose down
# Reset chain to genesis:  docker compose down -v

services:
  validator1:
    image: hyperledger/besu:26.7.1
    container_name: carbon-validator1
    environment: { BESU_OPTS: "-Xmx768m" }
    command: >-
      --genesis-file=/config/genesis.json
      --node-private-key-file=/keys/key
      --data-path=/data
      --p2p-host=172.25.0.11
      --bootnodes=enode://24350f6267f689a7d7e3bb3964cac26fa6bbf880480e7ed901c91b5d8be77a8ca671f0c8e4a08faa1031a6799868f91ec6596906e97a61337625b78fe4fb86b3@172.25.0.12:30303,enode://d3522d1fea5e32d93cc5e35611b715244347377f0a54cedc27d69ea2b1305f279e3e09d59a86a7934ddc8483612aab52d7cabcb1b5912cf54c7538a129b2be84@172.25.0.13:30303,enode://36288596d5d423aebdadc59f34d8548554ed9fd8266e277904289d7e6209926dfd891abb37b5743d7ef06d8cc6ce3bf299ce9d3d90bc86d1b78d0d5fcda4d2d1@172.25.0.14:30303
      --permissions-nodes-config-file-enabled
      --permissions-nodes-config-file=/config/permissions_config.toml
      --permissions-accounts-config-file-enabled
      --permissions-accounts-config-file=/config/permissions_config.toml
      --rpc-http-enabled
      --rpc-http-host=0.0.0.0
      --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN,PERM,TXPOOL
      --rpc-http-cors-origins=all
      --host-allowlist=*
      --min-gas-price=0
    volumes:
      - ./genesis.json:/config/genesis.json:ro
      # NOT read-only: Besu verifies at startup that it can persist
      # runtime allowlist amendments back to this file.
      - ./permissions_config.toml:/config/permissions_config.toml
      - ./nodes/validator1:/keys:ro
      - validator1-data:/data
    ports:
      - "8545:8545"
    networks:
      carbon-net:
        ipv4_address: 172.25.0.11

  validator2:
