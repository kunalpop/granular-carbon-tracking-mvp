<svg viewBox="0 0 904 945" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- Coordinate convention: 2 user units = 1 pt at 15.92 cm text width.
       font-size 26 = 13 pt, 22 = 11 pt, 20 = 10 pt, 18 = 9 pt, 16 = 8 pt. -->
  <rect x="0" y="0" width="904" height="945" fill="#ffffff"/>

  <!-- phase bands -->
  <g>
    <rect x="20" y="45" width="55" height="125" rx="7" fill="#dfe7f3" stroke="#4472c4" stroke-width="2"/>
    <text transform="rotate(-90, 47, 107)" x="47" y="107" font-size="18" text-anchor="middle" font-weight="700" fill="#23406e">Identification</text>

    <rect x="20" y="214" width="55" height="340" rx="7" fill="#dfe7f3" stroke="#4472c4" stroke-width="2"/>
    <text transform="rotate(-90, 47, 384)" x="47" y="384" font-size="18" text-anchor="middle" font-weight="700" fill="#23406e">Screening</text>

    <rect x="20" y="601" width="55" height="95" rx="7" fill="#dfe7f3" stroke="#4472c4" stroke-width="2"/>
    <text transform="rotate(-90, 47, 648)" x="47" y="648" font-size="18" text-anchor="middle" font-weight="700" fill="#23406e">Included</text>

    <rect x="20" y="738" width="55" height="150" rx="7" fill="#fdfaf3" stroke="#b8912f" stroke-width="2" stroke-dasharray="8 5"/>
    <text transform="rotate(-90, 47, 813)" x="47" y="813" font-size="17" text-anchor="middle" font-weight="700" fill="#7a5f14">Future research</text>
  </g>

  <!-- identification -->
  <rect x="95" y="45" width="370" height="125" rx="9" fill="#eef3fa" stroke="#4472c4" stroke-width="2.5"/>
  <text x="280" y="80" font-size="20" text-anchor="middle" font-weight="700">Records identified through</text>
  <text x="280" y="104" font-size="20" text-anchor="middle" font-weight="700">database searching</text>
  <text x="280" y="128" font-size="17" text-anchor="middle" fill="#555">Scopus; three search strings; 2018 to 2024</text>
  <text x="280" y="157" font-size="22" text-anchor="middle" font-weight="700">n = 1,059</text>

  <rect x="520" y="58" width="364" height="80" rx="9" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="2"/>
  <text x="538" y="92" font-size="18" font-weight="700">Records removed before screening</text>
  <text x="538" y="118" font-size="17" fill="#555">duplicate records (n = 23)</text>

  <!-- screening -->
  <rect x="95" y="214" width="370" height="105" rx="9" fill="#eef3fa" stroke="#4472c4" stroke-width="2.5"/>
  <text x="280" y="250" font-size="20" text-anchor="middle" font-weight="700">Records screened on title</text>
  <text x="280" y="274" font-size="20" text-anchor="middle" font-weight="700">and abstract</text>
  <text x="280" y="303" font-size="22" text-anchor="middle" font-weight="700">n = 1,036</text>

  <rect x="520" y="214" width="364" height="210" rx="9" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="2"/>
  <text x="538" y="246" font-size="18" font-weight="700">Records excluded (n = 898)</text>
  <text x="538" y="274" font-size="16" fill="#555">existing literature reviews (n = 112)</text>
  <text x="538" y="296" font-size="16" fill="#555">blockchain systems unrelated to</text>
  <text x="552" y="318" font-size="16" fill="#555">sustainability (n = 195)</text>
  <text x="538" y="340" font-size="16" fill="#555">cryptocurrency studies (n = 51)</text>
  <text x="538" y="362" font-size="16" fill="#555">LCA or framework papers without</text>
  <text x="552" y="384" font-size="16" fill="#555">blockchain (n = 108)</text>
  <text x="538" y="406" font-size="16" fill="#555">other off-topic records (n = 432)</text>

  <rect x="95" y="454" width="370" height="105" rx="9" fill="#eef3fa" stroke="#4472c4" stroke-width="2.5"/>
  <text x="280" y="490" font-size="20" text-anchor="middle" font-weight="700">Full-text reports assessed</text>
  <text x="280" y="514" font-size="20" text-anchor="middle" font-weight="700">for eligibility</text>
  <text x="280" y="543" font-size="22" text-anchor="middle" font-weight="700">n = 138</text>

  <rect x="520" y="454" width="364" height="100" rx="9" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="2"/>
  <text x="538" y="486" font-size="18" font-weight="700">Reports excluded (n = 57)</text>
  <text x="538" y="514" font-size="17" fill="#555">not retrievable (n = 17)</text>
  <text x="538" y="538" font-size="17" fill="#555">not relevant (n = 40)</text>

  <!-- included -->
  <rect x="95" y="601" width="370" height="95" rx="9" fill="#e8eef9" stroke="#2f5597" stroke-width="3.5"/>
  <text x="280" y="640" font-size="22" text-anchor="middle" font-weight="700">Studies included in the review</text>
  <text x="280" y="675" font-size="26" text-anchor="middle" font-weight="700">n = 81</text>

  <!-- future research stage -->
  <rect x="95" y="738" width="370" height="150" rx="9" fill="#fdfaf3" stroke="#b8912f" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="280" y="772" font-size="19" text-anchor="middle" font-weight="700">Supplementary update:</text>
  <text x="280" y="796" font-size="19" text-anchor="middle" font-weight="700">specified as future research</text>
  <text x="280" y="824" font-size="17" text-anchor="middle" fill="#555">window extended to mid-2025;</text>
  <text x="280" y="846" font-size="17" text-anchor="middle" fill="#555">Web of Science added; Theme 4 searches</text>
  <text x="280" y="868" font-size="17" text-anchor="middle" fill="#555">protocol in Appendix F.2; not executed</text>

  <!-- main flow -->
  <g stroke="#666" stroke-width="2.5" fill="#666">
    <line x1="280" y1="170" x2="280" y2="205"/><polygon points="280,214 273,200 287,200"/>
    <line x1="280" y1="319" x2="280" y2="445"/><polygon points="280,454 273,440 287,440"/>
    <line x1="280" y1="559" x2="280" y2="592"/><polygon points="280,601 273,587 287,587"/>
  </g>
  <g stroke="#b8912f" stroke-width="2.5" fill="none" stroke-dasharray="9 6">
    <line x1="280" y1="696" x2="280" y2="729"/>
  </g>
  <polygon points="280,738 273,724 287,724" fill="#b8912f"/>

  <!-- exclusion arrows -->
  <g stroke="#666" stroke-width="2.5" fill="#666">
    <line x1="465" y1="98" x2="508" y2="98"/><polygon points="520,98 506,91 506,105"/>
    <line x1="465" y1="250" x2="508" y2="250"/><polygon points="520,250 506,243 506,257"/>
    <line x1="465" y1="500" x2="508" y2="500"/><polygon points="520,500 506,493 506,507"/>
  </g>

  <text x="20" y="925" font-size="17" fill="#7a7a7a">Dashed outline marks the supplementary stage specified as future research, not executed here.</text>
</svg>
