<svg viewBox="0 0 904 595" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- Coordinate convention: 2 user units = 1 pt at 15.92 cm text width.
       font-size 18 = 9 pt, 17 = 8.5 pt, 16 = 8 pt. -->
  <rect x="0" y="0" width="904" height="595" fill="#ffffff"/>

  <text x="299" y="48" font-size="16" text-anchor="middle" font-weight="700" fill="#1f3a5f">hash-link</text>
  <text x="603" y="48" font-size="16" text-anchor="middle" font-weight="700" fill="#1f3a5f">hash-link</text>

  <!-- event 0 -->
  <rect x="25" y="62" width="244" height="220" rx="8" fill="#eef3fa" stroke="#4472c4" stroke-width="2.5"/>
  <text x="147" y="92" font-size="18" text-anchor="middle" font-weight="700">Event 0 · stage 1</text>
  <text x="43" y="120" font-size="16">actor: smelter (signed)</text>
  <text x="43" y="142" font-size="16">co2e computed on-chain</text>
  <text x="43" y="164" font-size="16">timestamp: block clock</text>
  <text x="43" y="186" font-size="16">evidenceHash: 0x93cc…</text>
  <rect x="39" y="198" width="216" height="30" rx="4" fill="#ffffff" stroke="#4472c4" stroke-width="2"/>
  <text x="47" y="218" font-size="16" font-weight="600">prevEventHash: genesis</text>
  <rect x="39" y="236" width="216" height="30" rx="4" fill="#dce8f8" stroke="#4472c4" stroke-width="2"/>
  <text x="47" y="256" font-size="16" font-weight="700">eventHash = keccak256</text>

  <!-- event 1 -->
  <rect x="329" y="62" width="244" height="220" rx="8" fill="#eef3fa" stroke="#4472c4" stroke-width="2.5"/>
  <text x="451" y="92" font-size="18" text-anchor="middle" font-weight="700">Event 1 · stage 2</text>
  <text x="347" y="120" font-size="16">actor: PCB supplier (signed)</text>
  <text x="347" y="142" font-size="16">co2e computed on-chain</text>
  <text x="347" y="164" font-size="16">timestamp: block clock</text>
  <text x="347" y="186" font-size="16">evidenceHash: 0xfc40…</text>
  <rect x="343" y="198" width="216" height="30" rx="4" fill="#ffffff" stroke="#4472c4" stroke-width="2"/>
  <text x="351" y="218" font-size="16" font-weight="600">prevEventHash = Event 0</text>
  <rect x="343" y="236" width="216" height="30" rx="4" fill="#dce8f8" stroke="#4472c4" stroke-width="2"/>
  <text x="351" y="256" font-size="16" font-weight="700">eventHash = keccak256</text>

  <!-- event 2 -->
  <rect x="633" y="62" width="244" height="220" rx="8" fill="#eef3fa" stroke="#4472c4" stroke-width="2.5"/>
  <text x="755" y="92" font-size="18" text-anchor="middle" font-weight="700">Event 2 · stage 3</text>
  <text x="651" y="120" font-size="16">actor: battery maker (signed)</text>
  <text x="651" y="142" font-size="16">co2e computed on-chain</text>
  <text x="651" y="164" font-size="16">timestamp: block clock</text>
  <text x="651" y="186" font-size="16">evidenceHash: 0x4807…</text>
  <rect x="647" y="198" width="216" height="30" rx="4" fill="#ffffff" stroke="#4472c4" stroke-width="2"/>
  <text x="655" y="218" font-size="16" font-weight="600">prevEventHash = Event 1</text>
  <rect x="647" y="236" width="216" height="30" rx="4" fill="#dce8f8" stroke="#4472c4" stroke-width="2"/>
  <text x="655" y="256" font-size="16" font-weight="700">eventHash = keccak256</text>

  <!-- chain links -->
  <g stroke="#1f3a5f" stroke-width="3" fill="#1f3a5f">
    <path d="M 269 251 C 300 251 300 213 325 213" fill="none"/>
    <polygon points="329,213 315,206 315,220"/>
    <path d="M 573 251 C 604 251 604 213 629 213" fill="none"/>
    <polygon points="633,213 619,206 619,220"/>
  </g>

  <!-- off-chain evidence -->
  <rect x="52" y="340" width="190" height="58" rx="6" fill="#f2f7f2" stroke="#5b9358" stroke-width="2"/>
  <text x="147" y="366" font-size="16" text-anchor="middle">meter-reading.pdf</text>
  <text x="147" y="387" font-size="16" text-anchor="middle" fill="#555">off-chain evidence</text>
  <rect x="356" y="340" width="190" height="58" rx="6" fill="#f2f7f2" stroke="#5b9358" stroke-width="2"/>
  <text x="451" y="366" font-size="16" text-anchor="middle">invoice-4411.pdf</text>
  <text x="451" y="387" font-size="16" text-anchor="middle" fill="#555">off-chain evidence</text>
  <rect x="660" y="340" width="190" height="58" rx="6" fill="#f2f7f2" stroke="#5b9358" stroke-width="2"/>
  <text x="755" y="366" font-size="16" text-anchor="middle">cell-batch-log.csv</text>
  <text x="755" y="387" font-size="16" text-anchor="middle" fill="#555">off-chain evidence</text>

  <g stroke="#5b9358" stroke-width="2.5" stroke-dasharray="7 4" fill="#5b9358">
    <line x1="147" y1="338" x2="147" y2="296"/><polygon points="147,286 141,296 153,296"/>
    <line x1="451" y1="338" x2="451" y2="296"/><polygon points="451,286 445,296 457,296"/>
    <line x1="755" y1="338" x2="755" y2="296"/><polygon points="755,286 749,296 761,296"/>
  </g>
  <text x="180" y="322" font-size="16" fill="#2c5530">keccak256 anchor (DP1 hybrid hash)</text>

  <!-- tamper consequence band -->
  <rect x="25" y="425" width="854" height="145" rx="8" fill="#fdf0f0" stroke="#c44" stroke-width="2.5"/>
  <text x="45" y="455" font-size="18" font-weight="700" fill="#8b1a1a">Why tampering is detectable</text>
  <text x="45" y="485" font-size="17" fill="#5a1010">Altering any stored field of Event 1 changes its recomputed keccak256, which no longer equals</text>
  <text x="45" y="507" font-size="17" fill="#5a1010">its stored eventHash. Event 2's stored prevEventHash then points to a hash that no longer</text>
  <text x="45" y="529" font-size="17" fill="#5a1010">exists, breaking every later link. Swapping an off-chain evidence file breaks its anchor the</text>
  <text x="45" y="551" font-size="17" fill="#5a1010">same way. The chain head is replicated across all five nodes.</text>
</svg>
